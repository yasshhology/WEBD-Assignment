<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 10: Multimedia: Image, Video, Audio and Youtube</title>
</head>
<body>
    <main style="margin-left: 50px;">
        <h4>Image</h4>
        <img src="campus.jpg" alt="College campus" width="130" height="130">

        <h4>Video</h4>
        <video width="300" controls>
            <source src="intro.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <h4>Audio</h4>
        <audio controls>
            <source src="welcome.mp3" type="audio/mpeg">
            Your browser does not support the audio tag.
        </audio>

        <h4>Youtube</h4>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/C9OmyNRyz4E?si=2DN3cJSmzaDkC4c3" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </main>
</body>
</html>
