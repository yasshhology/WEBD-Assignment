<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 17: Form Attributes and Input Validation</title>
</head>
<body>
  <form method="post" action="submit.php">
    <p><input type="text" name="fullname" placeholder="Full name" aria-label="Full name" required></p>
    <p><input type="email" name="email" placeholder="you@college.edu" aria-label="Email" required></p>
    <p><input type="text" name="mobile" placeholder="10-digit mobile" aria-label="Mobile number"
        pattern="[0-9]{10}" title="Enter exactly 10 digits" required></p>
    <p><input type="password" name="password" placeholder="Min 6 characters" aria-label="Password"
        minlength="6" required></p>
    <p><input type="number" name="age" placeholder="Age (17-30)" aria-label="Age" min="17" max="30" required></p>
    <p><button type="submit">Register</button></p>
  </form>
</body>
</html>
