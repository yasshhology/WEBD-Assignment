<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 5: Unordered, Ordered and Description Lists</title>
</head>
<body>
    <h3> Unordered</h3>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <h3> Ordered</h3>
    <ol type="A">
        <li>Install VS Code</li>
        <li>Create file</li>
        <li>Open in browser</li>
    </ol>

    <h3> Description</h3>
    <dl>
        <dt>HTML</dt>
        <dd>Hypertext Markup Language</dd>
        <dt>CSS</dt>
        <dd>Cascading Style Sheets</dd>
    </dl>
</body>
</html>
